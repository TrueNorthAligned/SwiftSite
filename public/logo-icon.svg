    <line x1="55" y1="36" x2="68" y2="36" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="44" x2="68" y2="44" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="52" x2="63" y2="52" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>
  </g>
  
