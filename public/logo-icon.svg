    <line x1="62" y1="18" x2="62" y2="45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- f -->
    <line x1="73" y1="18" x2="73" y2="45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="69" y1="18" x2="82" y2="18" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="73" y1="29" x2="80" y2="29" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- t -->
    <line x1="92" y1="18" x2="92" y2="45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="84" y1="10" x2="100" y2="10" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- S -->
    <path d="M107 15 Q115 8 118 15 Q121 22 113 26 Q105 30 108 38 Q111 45 120 45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
