    <line x1="127" y1="18" x2="127" y2="45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- t -->
    <line x1="139" y1="18" x2="139" y2="45" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="131" y1="10" x2="147" y2="10" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    
