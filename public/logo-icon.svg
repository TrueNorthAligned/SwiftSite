    <path d="M158 28 Q155 22 160 18 Q167 18 169 25" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <line x1="158" y1="32" x2="169" y2="32" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
