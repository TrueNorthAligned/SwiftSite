<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Section — SwiftSite Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; color: #0F172A; }
    .about { padding: 80px 24px; background-color: #FFFFFF; }
    .about-inner { max-width: 800px; margin: 0 auto; }
    .about h2 { font-size: 32px; font-weight: 700; margin-bottom: 20px; }
    .about p { font-size: 16px; line-height: 1.7; color: #64748B; }
  </style>
</head>
<body>
  <section class="about">
    <div class="about-inner">
      <h2>About Us</h2>
      <p>We help small businesses build a stunning online presence. Our drag-and-drop builder makes it easy to create a professional website in hours, not weeks.</p>
    </div>
  </section>
</body>
</html>
