<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section — SwiftSite Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; }
    .hero { padding: 120px 24px; text-align: center; background-color: #2563EB; color: #FFFFFF; }
    .hero-inner { max-width: 700px; margin: 0 auto; }
    .hero h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; line-height: 1.15; }
    .hero p { font-size: 18px; margin-bottom: 32px; opacity: 0.9; line-height: 1.6; }
    .hero .cta { display: inline-block; padding: 14px 36px; border-radius: 8px; font-weight: 600; font-size: 16px; text-decoration: none; background-color: #0D9488; color: #FFFFFF; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-inner">
      <h1>Build Your Business Website. Fast.</h1>
      <p>No coding required. Drag, drop, and publish in hours — not weeks.</p>
      <a href="#" class="cta">Get Started Free</a>
    </div>
  </section>
</body>
</html>
