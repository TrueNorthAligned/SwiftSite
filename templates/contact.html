<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Section — SwiftSite Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; color: #0F172A; }
    .contact { padding: 80px 24px; background-color: #FFFFFF; }
    .contact-inner { max-width: 800px; margin: 0 auto; }
    .contact h2 { font-size: 32px; font-weight: 700; margin-bottom: 24px; }
    .contact p { font-size: 16px; line-height: 1.6; margin-bottom: 8px; }
  </style>
</head>
<body>
  <section class="contact">
    <div class="contact-inner">
      <h2>Contact Us</h2>
      <p>✉️ hello@example.com</p>
      <p>📞 (555) 123-4567</p>
      <p>📍 123 Main St, City, State</p>
    </div>
  </section>
</body>
</html>
